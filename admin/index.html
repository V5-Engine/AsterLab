<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Authentication | Aster Lab</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-auth-wrapper">
    <div class="admin-login-card">
      
      <!-- Brand -->
      <div class="brand">
        <a href="./index.html" class="brand">
            <img alt="navLogo" loading="lazy" width="147" height="40" decoding="async" data-nimg="1" sizes="100%"src="https://www.asterlabs.in/_next/image?url=https%3A%2F%2Fasterlab-website-images.s3.ap-south-1.amazonaws.com%2Fimages%2FAsterMainLogoHead.png&w=1920&q=60" style="color: transparent;">
        </a>
      </div>

      <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.4rem; color: #FFFFFF; margin-bottom: 0.4rem;">Clinical Administration</h2>
        <p style="font-size: 0.85rem; color: #94A3B8;">Sign in to manage offers, appointments & sample collections.</p>
      </div>

      <!-- Error Alert Box -->
      <div id="login-error-alert" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #FCA5A5; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.5rem; text-align: center;">
      </div>

      <!-- Login Form -->
      <form id="admin-login-form">
        <div class="form-group">
          <label for="admin-email" class="form-label">Admin Email</label>
          <input type="email" id="admin-email" class="form-control" value="admin@asterlab.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="admin-password" class="form-label">Password</label>
          <input type="password" id="admin-password" class="form-control" value="AsterAdmin2026!" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.85rem;">
          Sign In to Portal
        </button>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: #64748B;">
          Demo credentials prefilled for instant review.<br>
          <a href="../index.html" style="color: var(--accent-cyan); text-decoration: underline; margin-top: 0.5rem; display: inline-block;">&larr; Back to Public Website</a>
        </div>
      </form>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
