<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="asterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00D2D3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base -->
  <rect width="120" height="120" rx="28" fill="#0A1128" />
  <!-- Futuristic Diamond Core -->
  <g transform="translate(60, 60)" filter="url(#glow)">
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="none" stroke="url(#asterGrad)" stroke-width="4" />
    <!-- Dynamic Hex Nodes -->
    <circle cx="0" cy="-36" r="4" fill="#00D2D3" />
    <circle cx="31" cy="-18" r="4" fill="#00D2D3" />
    <circle cx="31" cy="18" r="4" fill="#0284C7" />
    <circle cx="0" cy="36" r="4" fill="#0284C7" />
    <circle cx="-31" cy="18" r="4" fill="#0284C7" />
    <circle cx="-31" cy="-18" r="4" fill="#00D2D3" />
    <!-- Inner Cross / Pulse -->
    <path d="M-14,0 L-6,0 L-2,-12 L4,14 L8,-5 L12,0 L18,0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
